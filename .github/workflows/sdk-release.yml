name: SDK Release

# Two-step release, driven by changesets.
#
#   1. A change lands on main carrying a changeset. This workflow opens (or
#      updates) a "Version Packages" pull request that consumes the queued
#      changesets, bumps the version, and writes the changelog.
#   2. That pull request is merged. This workflow runs again, finds no changesets
#      left, and publishes.
#
# The version bump is therefore a REVIEWED COMMIT, not a side effect of merging.
# Someone looks at the computed version and the changelog before anything reaches
# a registry, which matters because a publish cannot be taken back — npm and PyPI
# both refuse to re-upload a version, even after an unpublish.
on:
  push:
    branches: [main]
    paths:
      - "api/proto/**"
      - "sdk/**"
      - "scripts/sync-python-version.mjs"
      # The changesets that DRIVE a release live here, along with the workspace
      # root that resolves them. Leaving these out means adding a changeset never
      # triggers the release that consumes it.
      - ".changeset/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk-release.yml"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the current sdk/python version to PyPI, without npm having just published. Recovery for a release where npm succeeded and PyPI did not."
        type: boolean
        default: false

concurrency:
  # Never two releases at once. A second run mid-publish could push a version the
  # first run was already uploading.
  group: sdk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push the tag
      pull-requests: write # open the "Version Packages" pull request
      id-token: write # npm provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs history to work out what has already been released.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Publishing is irreversible, so the gate comes before it rather than in a
      # workflow that merely ran at some point on some commit.
      - name: Tests must pass before anything is published
        run: npm run test:sdk

      - name: The SDK versions must agree
        run: node scripts/sync-python-version.mjs --check

      # Identity, before the publish rather than after it fails. An npm publish
      # that is rejected reports what the REGISTRY objected to, never which
      # account it objected about, so a token belonging to the wrong user reads
      # exactly like a token of the wrong type.
      - name: Who does the npm token authenticate as
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm user:  $(npm whoami 2>&1 || echo '(token did not authenticate)')"
          echo "orgs this user belongs to:"
          npm org ls glyphsoftware 2>&1 | head -5 || echo "  (cannot list @glyphsoftware — not a member, or the org does not exist)"
          # Not reading the 2FA mode here: `npm profile get` is itself gated by
          # the setting it would report, so on the accounts where it matters it
          # fails rather than answers.

      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Deliberately no `cwd`. The action commits with `git add .` from its
          # working directory, so pointing it at sdk/typescript silently dropped
          # the Python version bump from the release commit — npm went to 0.1.0
          # while sdk/python stayed behind. Running from the repository root is
          # what makes the two packages move together.
          #
          # Runs `changeset version` and then carries the computed version to the
          # Python package, which changesets cannot see.
          version: npm run version-packages
          publish: npm run release
          title: "Release: version the SDK packages"
          commit: "Version the SDK packages"
        env:
          # CHANGESETS_TOKEN when it exists, the built-in token otherwise.
          #
          # An organization policy can forbid GitHub Actions from creating pull
          # requests, and when it does the built-in token gets a 403 at the last
          # step of an otherwise successful run — the version commit is pushed and
          # then nothing opens a pull request for it. That restriction applies to
          # the Actions token, not to a user token, so a PAT with `contents: write`
          # and `pull-requests: write` routes around it without any org change.
          #
          # A PAT also makes the version pull request run its own checks, which a
          # pull request opened by the built-in token deliberately does not.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Read the released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: |
          v=$(node -p "require('./sdk/typescript/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "published SDK $v to npm"

  pypi:
    # The Python package goes out after npm succeeded, on the same commit and
    # therefore the same version.
    #
    # The two uploads are NOT atomic and no arrangement of CI would make them so,
    # which means the recovery path has to be real rather than aspirational. It
    # runs when npm has just published, AND on a manual dispatch with
    # publish_pypi set — because after a half-completed release npm has nothing
    # left to publish, so a plain re-run reports published=false and this job
    # would skip forever, leaving PyPI permanently behind.
    #
    # It is also idempotent: a version already on PyPI is skipped rather than
    # re-uploaded, so running it twice is harmless.
    needs: release
    if: always() && (needs.release.outputs.published == 'true' || inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datagit-sdk
    permissions:
      id-token: write # PyPI trusted publishing; no long-lived token to leak
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump was committed by the job above, so take the tip of
          # main rather than the commit that triggered the run.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out what would be published
        id: v
        run: |
          version=$(grep -m1 '^version *= *"' sdk/python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sdk/python is at $version"

          # When npm published in this same run, the two must agree. On a
          # recovery dispatch there is no npm version to compare against.
          npm_version='${{ needs.release.outputs.version }}'
          if [ -n "$npm_version" ] && [ "$npm_version" != "$version" ]; then
            echo "npm published $npm_version but sdk/python is $version."
            echo "Publishing would put a different version on PyPI than on npm."
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/datagit-sdk/$version/json")
          if [ "$code" = "200" ]; then
            echo "PyPI already has datagit-sdk $version; nothing to do."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the distributions
        if: steps.v.outputs.already != 'true'
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.v.outputs.already != 'true'
        with:
          packages-dir: sdk/python/dist
