# TypeScript SDK generation (M7.4).
#
# Separate from buf.gen.yaml so `make proto` stays fast and does not require a
# node_modules tree. Run `make sdk-ts` to regenerate.
version: v2
plugins:
  - local: sdk/typescript/node_modules/.bin/protoc-gen-es
    out: sdk/typescript/src/gen
    opt:
      - target=ts
      - import_extension=js
