[project]
name = "datagit"
version = "0.1.0"
description = "DataGit's Python SDK: Git-style version control for rows in your own database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[project.optional-dependencies]
dev = ["pytest", "grpcio-tools"]

[project.urls]
Homepage = "https://github.com/Glyph-Software/datagit"
Documentation = "https://github.com/Glyph-Software/datagit/tree/main/sdk"
Source = "https://github.com/Glyph-Software/datagit"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datagit*"]
