# Development databases for DataGit.
# PostgreSQL 16 and 17 per PLAN.md M0.2. MySQL 8.4 is added in M5 (v1.1).
services:
  pg17:
    image: postgres:17
    environment:
      POSTGRES_USER: datagit
      POSTGRES_PASSWORD: datagit
      POSTGRES_DB: datagit
    ports: ["55417:5432"]
    volumes: ["pg17data:/var/lib/postgresql/data"]
    shm_size: 1gb
    # Tuned for the Phase 0 spikes: large synthetic sidecars, heavy index builds.
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=256MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=8GB
      -c checkpoint_timeout=30min
      -c random_page_cost=1.1
      -c effective_cache_size=6GB
      -c track_io_timing=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datagit"]
      interval: 3s
      timeout: 5s
      retries: 30

  pg16:
    image: postgres:16
    environment:
      POSTGRES_USER: datagit
      POSTGRES_PASSWORD: datagit
      POSTGRES_DB: datagit
    ports: ["55416:5432"]
    volumes: ["pg16data:/var/lib/postgresql/data"]
    shm_size: 1gb
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=256MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=8GB
      -c checkpoint_timeout=30min
      -c random_page_cost=1.1
      -c effective_cache_size=6GB
      -c track_io_timing=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datagit"]
      interval: 3s
      timeout: 5s
      retries: 30

  # MySQL 8.4 for S4 (the resumable migration spike) and the M5 adapter.
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: datagit
      MYSQL_DATABASE: datagit
      MYSQL_USER: datagit
      MYSQL_PASSWORD: datagit
    ports: ["55484:3306"]
    volumes: ["mysql84data:/var/lib/mysql"]
    command: >
      mysqld
      --innodb-buffer-pool-size=2G
      --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udatagit", "-pdatagit"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg17data:
  pg16data:
  mysql84data:
